name: Android CI & APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Prepare Debug Keystore if Needed
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure Bundled Typography Assets Exist
        run: |
          mkdir -p app/src/main/res/font
          if [ ! -s app/src/main/res/font/space_grotesk.ttf ]; then
            curl -fSL "https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" -o app/src/main/res/font/space_grotesk.ttf
          fi
          if [ ! -s app/src/main/res/font/plus_jakarta_sans.ttf ]; then
            curl -fSL "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -o app/src/main/res/font/plus_jakarta_sans.ttf
          fi
          if [ ! -s app/src/main/res/font/jetbrains_mono.ttf ]; then
            curl -fSL "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" -o app/src/main/res/font/jetbrains_mono.ttf
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Installable Android APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TicTacToe-v1.0.0.apk
          ls -lh TicTacToe-v1.0.0.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-v1.0.0-APK
          path: TicTacToe-v1.0.0.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TicTacToe-v1.0.0.apk
          generate_release_notes: true
          body: |
            ## Tic Tac Toe — Atelier XO Edition (${{ github.ref_name }})
            
            ### Highlights
            - **Redesigned Mobile Game Interface**: Clean, tactile 3×3 game board centerpiece with responsive X/O stroke animations, compact player score capsules, and celebratory match result sheets.
            - **Gemini API Manager**: Add, name, test, switch, replace, and remove multiple personal Gemini API keys with Android Keystore (`AES/GCM/NoPadding`) encryption, masked previews, live status badges (`Valid`, `Quota Exceeded`, `Invalid`), and automatic multi-key + Local Master AI failover.
            - **Game Modes & Rules**: Pass & Play (2P), Local Master AI (Minimax with Alpha-Beta Pruning), and Gemini AI across both **Classic 3×3** and **Infinity 3-Mark Mode**.
            - **Match Archive & Replay Inspector**: Persistent Room database match history with step-by-step board replay scrubber.
            - **Acoustic Chimes & Haptics**: Synthesized 16-bit PCM marimba & ceramic chimes + physical haptic feedback.
